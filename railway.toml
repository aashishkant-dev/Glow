[build]
builder = "NIXPACKS"

[deploy]
# Apply any pending Prisma migrations before booting so new columns exist before
# the server queries them. `migrate deploy` is safe + idempotent (no-op if none).
startCommand = "npx prisma migrate deploy && npm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
