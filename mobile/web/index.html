<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Glow</title>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; background-color: #F1F5F9; }
      #root { display: flex; height: 100%; flex: 1; }
      /* RN Web renders every TextInput as a real <input>, which browsers give
         a default focus ring (blue in Chrome, gold in Safari) — with no
         override that shows as a stray colored box around any focused input,
         search bar, or OTP digit box app-wide. Inputs already get an
         intentional focus treatment (border/background change) in their own
         styles, so the native ring is just noise on top of that. */
      input:focus, textarea:focus { outline: none; }
    </style>

    <meta name="theme-color" content="#B76E79" />
    <meta name="description" content="Glow — beauty artists on demand. Book hair, makeup, nails and more, at your door." />

    <!-- Preconnect to API — saves ~300ms on first request -->
    <link rel="preconnect" href="https://glow-backend-production-ae1e.up.railway.app" crossorigin />
    <link rel="dns-prefetch" href="https://glow-backend-production-ae1e.up.railway.app" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Glow" />
    <!-- ?v=3 busts week-long icon caches + Chrome's sticky favicon cache —
         old CareNearby-era icons kept showing without it -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-192.png?v=3" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-192.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />

    <!-- Android / Chrome PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- SVG favicon: crisp at all sizes, shown in browser tab -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=3" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
