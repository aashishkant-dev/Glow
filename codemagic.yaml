workflows:
  ios-testflight:
    name: Glow iOS — build & TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: mobile

    # This repo is a monorepo (mobile/, landing/, admin/, the backend at the
    # root) — only pushes that actually touch the mobile app should trigger
    # an iOS build. Adjust branch_patterns to whichever branch you want this
    # wired to (currently the one all of this session's fixes are on).
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: vision-camera-live-detection
          include: true
          source: true

    environment:
      node: 22.23.2
      # Codemagic requires every environment variable to belong to a named
      # group (there's no "ungrouped" option in their UI — confirmed
      # directly against this account's own "Group is required" field).
      # EXPO_TOKEN was added under a group named "expo"; referencing that
      # group here is what actually exposes it (as $EXPO_TOKEN) to every
      # script step below. This is the real fix for "bearer token is
      # invalid"/"EXPO_TOKEN is EMPTY" — the variable was never being
      # imported into the build at all, group name mismatch (in this case,
      # no group reference existing yet), not a bad token value.
      groups:
        - expo

    scripts:
      # Diagnostic only — does NOT print the token itself. "Bearer token is
      # invalid" from eas-cli could mean EXPO_TOKEN never reached this
      # shell at all (empty — usually a Codemagic-side variable/group
      # wiring issue) OR it reached the shell but Expo itself is rejecting
      # the value (present but still invalid — a token-generation issue).
      # Those need different fixes; this tells us which one we're dealing
      # with without ever exposing the secret in build logs.
      - name: Check EXPO_TOKEN is actually set
        script: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is EMPTY or unset in this shell — it's not reaching the build. Check Codemagic's environment variable / group wiring for this workflow."
            exit 1
          else
            echo "EXPO_TOKEN is set (length: ${#EXPO_TOKEN} characters, first 4 chars: ${EXPO_TOKEN:0:4}...)"
          fi

      - name: Install dependencies
        script: |
          npm ci

      # --local is the reason this sidesteps the EAS free-tier build queue
      # entirely: it runs the actual build (prebuild + Xcode archive) on
      # THIS machine (Codemagic's own runner), not on EAS's cloud build
      # infrastructure — so it doesn't touch, and isn't blocked by, the
      # EAS account's monthly cloud-build quota. Everything else about the
      # build (env vars, bundle identifier, signing) still comes from the
      # existing "production" profile in eas.json — nothing duplicated
      # here. eas-cli isn't a project dependency (removed on purpose, see
      # that commit) — npx fetches it on demand, same as any other one-off
      # CLI invocation.
      - name: EAS local build (iOS)
        script: |
          npx eas-cli build \
            --local \
            --platform ios \
            --profile production \
            --non-interactive \
            --output ./build.ipa

    artifacts:
      - mobile/build.ipa

    publishing:
      # Uses the SAME EXPO_TOKEN above — no separate App Store Connect API
      # key needed here either, since `eas submit` also authenticates
      # through Expo, which already has this project's submit config
      # (appleTeamId) from eas.json.
      scripts:
        - name: Submit to TestFlight
          script: |
            npx eas-cli submit \
              --platform ios \
              --path ./build.ipa \
              --non-interactive
