name: CI / CD

# Glow pipeline:
#   mobile-check → tsc + native (iOS/Android) Metro bundle. If this fails, an OTA
#                  update WOULD CRASH the live app. Hard gate.
#   backend-test → syntax + Jest + prisma validate + secret scan.
#   pwa-build    → expo web export + post-web-build.js (font relocation — without it
#                  Vercel drops fonts and every icon renders blank) + bundle assertions.
#   deploy       → main only. PWA (prebuilt) to Vercel project glow-app, then HARD
#                  post-deploy verification against the live URLs.
#
# Backend deploys are handled by Railway's own GitHub integration (connect the
# repo to the "glow" project / glow-backend service in the Railway dashboard).
# Railway runs `prisma migrate deploy` on boot (railway.toml startCommand), so
# CI does not run migrations.
#
# Required repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# (RAILWAY_API_TOKEN is also set for ad-hoc `railway` CLI use.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GLOW_API_URL: https://glow-backend-production-ae1e.up.railway.app
  GLOW_PWA_URL: https://glow-app-omega.vercel.app

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Mobile crash gate: typecheck + native bundle ─────────────────────────────
  mobile-check:
    name: Mobile crash gate (tsc + native bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci || npm ci || npm ci

      - name: TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Native bundle check (what OTA would ship)
        working-directory: mobile
        run: npx expo export -p ios -p android --output-dir /tmp/native-export
        env:
          CI: true
          EXPO_PUBLIC_API_URL: https://glow-backend-production-ae1e.up.railway.app
          EXPO_PUBLIC_REGION_LAT: 46.4917
          EXPO_PUBLIC_REGION_LNG: -80.9930
          EXPO_PUBLIC_REGION_NAME: Greater Sudbury, ON

      - name: Assert native bundle points at Glow, not CareNearby
        run: |
          if grep -rq "carenearby" /tmp/native-export/_expo 2>/dev/null; then
            echo "::error::CareNearby URL baked into native bundle — stale env leaked in."
            exit 1
          fi
          echo "✓ native bundle clean"

  # ── Backend tests ────────────────────────────────────────────────────────────
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci || npm ci || npm ci

      - name: Syntax check
        run: find src -name "*.js" ! -path "src/tests/*" | xargs -I{} node --check {}

      - name: Prisma schema validate
        run: ./node_modules/.bin/prisma validate

      - name: Run tests
        run: npm test

      - name: Check for hardcoded secrets
        run: |
          if grep -rn "sk_live_\|AIza" src/ --include="*.js"; then
            echo "Hardcoded secret found!" && exit 1
          fi

  # ── PWA build (web) ──────────────────────────────────────────────────────────
  pwa-build:
    name: PWA build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci || npm ci || npm ci

      - name: Build Expo web + post-process
        working-directory: mobile
        # post-web-build.js is NOT optional: it relocates vector-icon fonts out of
        # dist/assets/node_modules (Vercel silently drops node_modules paths →
        # every icon renders blank) and copies web/* PWA assets (manifest, sw, icons).
        run: |
          npx expo export -p web --output-dir dist
          node scripts/post-web-build.js
        env:
          CI: true
          # NO_SW: service worker disabled during active iteration so every
          # deploy is visible on plain refresh. Remove once the UI stabilizes.
          NO_SW: 1
          EXPO_PUBLIC_API_URL: https://glow-backend-production-ae1e.up.railway.app
          EXPO_PUBLIC_REGION_LAT: 46.4917
          EXPO_PUBLIC_REGION_LNG: -80.9930
          EXPO_PUBLIC_REGION_NAME: Greater Sudbury, ON
          # Google Sign-In client IDs — Expo inlines EXPO_PUBLIC_* at build time (this
          # step), not at Vercel deploy time (the prebuilt dist/ is only uploaded, never
          # rebuilt there) — these MUST be set here or the button silently disables.
          EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID_IOS: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_IOS }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID }}

      - name: Assert deployable bundle
        working-directory: mobile
        run: |
          FAIL=0
          if [ -d dist/assets/node_modules ]; then
            echo "::error::dist/assets/node_modules exists — Vercel drops it, icons will render blank."
            FAIL=1
          fi
          if grep -rq "carenearby" dist/_expo/static/js/web/*.js; then
            echo "::error::CareNearby URL found in prod PWA bundle — stale env leaked in."
            FAIL=1
          fi
          if grep -rq "assets/node_modules" dist/_expo/static/js/web/*.js; then
            echo "::error::Bundle still references assets/node_modules — fonts will 404."
            FAIL=1
          fi
          [ "$FAIL" = "0" ] && echo "✓ PWA bundle deployable (fonts relocated, Glow API only)"
          exit $FAIL

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pwa-dist
          path: mobile/dist/
          retention-days: 1

  # ── Deploy (main push only) ──────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [mobile-check, backend-test, pwa-build]
    # Legitimate worst case: vercel deploy (~1min) + API health retry (18×10s=3min)
    # + PWA bundle retry (10×90s=15min) ≈ 20min. 25min gives headroom without
    # letting a genuine hang (e.g. a curl call stalling past --max-time on a
    # connect-phase issue) run indefinitely — this job had no ceiling before and
    # was observed hanging 30+ min twice in a row with build/test already green.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # ── PWA: download artifact (already post-processed) + deploy ────────────
      - name: Download PWA artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: pwa-dist
          path: pwa-dist

      - name: Stage PWA under rootDirectory
        run: |
          # glow-app Vercel project: rootDirectory=mobile, outputDirectory=dist,
          # buildCommand:"" — files must land at pwa-dist/mobile/dist/.
          mkdir -p pwa-dist/mobile/dist
          for f in pwa-dist/*; do
            case "$f" in pwa-dist/mobile) ;; *) cp -r "$f" pwa-dist/mobile/dist/ ;; esac
          done
          cp mobile/vercel.json pwa-dist/mobile/vercel.json
          mkdir -p pwa-dist/.vercel
          cat > pwa-dist/.vercel/project.json << EOF
          {"projectId":"${VERCEL_PROJECT_ID}","orgId":"${VERCEL_ORG_ID}"}
          EOF
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy PWA to Vercel (glow-app)
        run: |
          vercel deploy pwa-dist --prod --yes \
            --token "$VERCEL_TOKEN" \
            --scope "aashishkants-projects" | tee /tmp/pwa-deploy.log
          DEPLOY_URL=$(grep -Eo "https://[a-zA-Z0-9._-]+\.vercel\.app" /tmp/pwa-deploy.log | tail -1)
          echo "PWA deployed: $DEPLOY_URL"
          [ -n "$DEPLOY_URL" ] || { echo "::error::PWA deploy produced no URL"; exit 1; }
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── Post-deploy verification — HARD failures ────────────────────────────
      - name: Verify API health (retry up to 3 min — Railway deploys independently)
        run: |
          for i in $(seq 1 18); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 \
              "$GLOW_API_URL/health" || echo "000")
            [ "$STATUS" = "200" ] && { echo "✓ API healthy"; exit 0; }
            echo "API HTTP $STATUS — retry $i/18"; sleep 10
          done
          echo "::error::API never became healthy after deploy"; exit 1

      - name: Verify PWA serves a working bundle
        run: |
          # The alias + CDN can lag the deploy by a few seconds — index.html and
          # the hashed bundle briefly disagree and the bundle 404s. Retry the
          # whole fetch (HTML + bundle together) so we never verify a torn state.
          OK=""
          for i in $(seq 1 10); do
            HTML=$(curl -s --max-time 30 -H 'Cache-Control: no-cache' "$GLOW_PWA_URL?ci=$i") || HTML=""
            BUNDLE=$(echo "$HTML" | grep -oE '/_expo/static/js/web/[^"]+\.js' | head -1)
            if [ -n "$BUNDLE" ] && curl -sf --max-time 60 "$GLOW_PWA_URL$BUNDLE" -o /tmp/bundle.js; then
              OK=1; break
            fi
            echo "PWA not consistent yet (bundle: ${BUNDLE:-none}) — retry $i/10"; sleep 10
          done
          [ -n "$OK" ] || { echo "::error::PWA bundle 404s — app is a blank page"; exit 1; }
          if grep -q "carenearby" /tmp/bundle.js; then
            echo "::error::LIVE PWA references CareNearby — stale env in bundle"; exit 1
          fi
          FONT=$(grep -oE '/assets/[^"]*MaterialCommunityIcons[^"]*\.ttf' /tmp/bundle.js | head -1)
          if [ -n "$FONT" ]; then
            FSTATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$GLOW_PWA_URL$FONT")
            [ "$FSTATUS" = "200" ] || { echo "::error::Icon font $FONT returns $FSTATUS — icons render blank"; exit 1; }
          fi
          echo "✓ PWA bundle live, Glow API, fonts served"
