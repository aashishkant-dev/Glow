# Pings the Railway backend every 10 min so it never cold-starts.
# Cold starts were the #1 cause of slow OTP / login (first request after idle
# took several seconds). A cheap GET /health keeps the dyno hot.
name: keep-warm

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://api.carenearby.app/health || echo "000")
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "health check did not return 200 after 3 attempts (non-fatal)"
